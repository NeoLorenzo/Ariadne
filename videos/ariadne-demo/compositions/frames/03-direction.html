      const POS = [

      const tiles = document.getElementById("f3-tiles");

        tiles.appendChild(el);
      });

      // Logical (pre-transform) offset of an element inside the stage.
      const stage = document.getElementById("f3-stage");
      const offsetIn = (el) => {
        let x = 0, y = 0, n = el;
        while (n && n !== stage) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
        return { x, y, w: el.offsetWidth, h: el.offsetHeight };
      };
      const S = 1.25; // stage scale on screen
      const toScreen = (p) => ({ x: 140 + p.x * S, y: 168 + p.y * S });

      const tl = gsap.timeline({ paused: true });

      // Scene 1 — headline fills the frame, the app rises beneath it in perspective.
      const head = document.getElementById("f3-head");
      const hw = head.offsetWidth, hh = head.offsetHeight;
      const hx = (1920 - hw) / 2, hy = (1080 - hh) / 2 - 40;
      tl.fromTo("#f3-head", { x: hx, y: hy + 40, opacity: 0, scale: 1 }, { y: hy, opacity: 1, duration: 0.5, ease: "expo.out" }, 0);

      tl.to("#f3-head", { x: 140, y: 70, scale: 0.3, duration: 0.75, ease: "expo.inOut" }, 1.024);
      tl.fromTo("#f3-stage", { scale: S, y: 480, opacity: 0 }, { y: 0, opacity: 1, duration: 1.3, ease: "expo.out" }, 0.35);
      tl.fromTo("#f3-window", { rotationX: 28 }, { rotationX: 0, duration: 1.5, ease: "expo.out" }, 0.35);
      tl.fromTo("#f3-cam", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.03, duration: 3.6, ease: "none" }, 0.2);

      // Scene 2 — current position counts up.
      POS.forEach(([, score], i) => {
        const at = 1.536 + i * 0.09;
        if (score !== null) {
          tl.fromTo("#f3-s" + i, { innerText: 0 }, { innerText: score, snap: { innerText: 1 }, duration: 0.9, ease: "power3.out" }, at);
          tl.fromTo("#f3-f" + i, { scaleX: 0 }, { scaleX: score / 100, duration: 0.9, ease: "power3.out" }, at);
        } else {
          tl.set("#f3-f" + i, { scaleX: 0 }, 0);
        }
      });
      tl.fromTo(".f3-tile", { opacity: 0.25, y: 6 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.09, ease: "power2.out" }, 1.5);
      tl.fromTo(".f3-notice", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.5, stagger: 0.12, ease: "power3.out" }, 2.048);

      // Scene 3 — the three concurrent directions arrive; the cursor enters.
      tl.fromTo(".f3-dir", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.12, ease: "expo.out" }, 3.072);

      const d1 = offsetIn(document.getElementById("f3-d1"));
      const tip = { x: d1.x + d1.w * 0.42, y: d1.y + d1.h * 0.42 };
      // Cursor path (logical coords; hotspot is 5,2.5 of a 26px svg ≈ 5.4,2.7 px).
      tl.set("#f3-cursor", { x: 1180, y: 690, opacity: 0, scale: 1 }, 0);
      tl.to("#f3-cursor", { opacity: 1, duration: 0.1 }, 3.2);
      tl.to("#f3-cursor", { x: 760, y: 470, duration: 0.6, ease: "power2.inOut" }, 3.3);
      tl.to("#f3-cursor", { x: tip.x - 5, y: tip.y - 3, duration: 0.65, ease: "power3.inOut" }, 3.9);
      // Hover state before the click.
      tl.to("#f3-d1", { borderColor: "#3f3f46", backgroundColor: "#111113", duration: 0.2 }, 4.45);

      // Scene 4 — camera punches in on the first direction; click at 4.85s.
      const c = toScreen({ x: d1.x + d1.w / 2, y: d1.y + d1.h / 2 });
      const Z = 2.05; // frame the card at (960, 560)
      tl.to("#f3-cam", { scale: Z, x: Z * (960 - c.x), y: 20 + Z * (540 - c.y), duration: 1.2, ease: "expo.inOut" }, 3.85);
      tl.to("#f3-cursor", { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, 4.6);
      tl.fromTo("#f3-ripple", { x: tip.x, y: tip.y, scale: 0.2, opacity: 0 }, { scale: 0.2, opacity: 1, duration: 0.01 }, 4.608);
      tl.to("#f3-ripple", { scale: 1.6, opacity: 0, duration: 0.5, ease: "power2.out" }, 4.62);
      tl.fromTo("#f3-glow", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 4.62);
      tl.fromTo("#f3-drives", { opacity: 0, y: -6, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)" }, 5.12);
      tl.to(["#f3-d2", "#f3-d3", "#f3-pos", "#f3-notices"], { opacity: 0.35, duration: 0.4 }, 4.75);

      window.__timelines["03-direction"] = tl;
      if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
    });
