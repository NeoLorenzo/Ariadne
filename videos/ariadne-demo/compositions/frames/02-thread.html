  <script>
    (function () {
      const K = 1000 / 560; // svg units → px
      const VECTORS = ["Physical", "Psychological", "Intellectual", "Professional", "Financial", "Relational", "Creative", "Experiential"];

      // Eight vector names orbit the outer wall.
      const labels = document.getElementById("f2-labels");
      VECTORS.forEach((name, i) => {
        const a = ((i * 45 + 22.5) * Math.PI) / 180;
        const r = 272 * K;
        const el = document.createElement("div");
        el.className = "f2-label";
        el.textContent = name;
        labels.appendChild(el);
        el.dataset.x = String(500 + Math.sin(a) * r);
        el.dataset.y = String(500 - Math.cos(a) * r);
      });
      const labelEls = Array.from(labels.children);

      const tl = gsap.timeline({ paused: true });

      // Scene 1 — the point from frame 1 pulses; eight rings ripple outward and draw on.
      tl.fromTo("#f2-dot", { scale: 1, svgOrigin: "0 0" }, { scale: 1.9, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, 0.05);
      tl.fromTo("#f2-dot-halo", { opacity: 0.4 }, { opacity: 1, duration: 0.3 }, 0);
      tl.fromTo("#f2-coreglow", { scale: 0.2, opacity: 0, svgOrigin: "0 0" }, { scale: 1, opacity: 1, duration: 0.8, ease: "power2.out" }, 0.05);
      gsap.utils.toArray(".f2-ring").forEach((ring, i) => {
        const at = 0.08 + i * 0.07;
        tl.fromTo(ring, { scale: 0.45, opacity: 0, svgOrigin: "0 0" }, { scale: 1, opacity: 1, duration: 0.7, ease: "expo.out" }, at);
        tl.fromTo(ring.querySelectorAll("path"), { strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.75, ease: "power3.out" }, at);
      });
      tl.fromTo("#f2-radials", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.7);
      labelEls.forEach((el, i) => {
        tl.fromTo(el,
          { x: +el.dataset.x, y: +el.dataset.y + 14, xPercent: -50, yPercent: -50, opacity: 0 },
          { y: +el.dataset.y, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.45 + i * 0.05);
