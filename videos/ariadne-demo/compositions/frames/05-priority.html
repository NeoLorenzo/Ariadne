  <script>
    document.fonts.load('900 112px "Inter"').then(function () {
      const COLORS = ["#0088ff", "#f26d6d", "#8b7dff", "#f0a53a", "#3ecf8e"];
      // [id, title, meta html, before priority, after priority, after index, signals]
      const ROWS = [
        ["reading", "Reorganize reading list", "<i>No strategic link</i>", 2, 4, 5, [0.06, 0.1, 0.12, 0.02, 0.9]],
        ["reply", "Reply to newsletter comments", "Reach 1,000 subscribers", 2, 3, 3, [0.35, 0.3, 0.3, 0.2, 0.9]],
        ["outline", "Outline the October essay", "Ship one essay every month · <em>Target in 5d</em>", 3, 2, 2, [0.72, 0.45, 0.6, 0.1, 0.8]],
        ["apply", "Apply: Frontier Safety Fellowship", "Earn a place in a research lab · <em>Closes in 3d</em>", 3, 1, 0, [0.96, 0.9, 0.86, 0.3, 0.82]],
        ["draft", "Draft methods section", "Publish original research · <em>Due in 2d</em>", 3, 1, 1, [0.94, 0.74, 0.8, 0.4, 0.9]],
        ["passport", "Renew passport", "Obligation · <em>Due in 12d</em>", 4, 4, 4, [0.02, 0.36, 0.08, 0.95, 0.7]],
      ];
      const STEP = 94;
      const list = document.getElementById("f5-list");
      const scan = document.getElementById("f5-scan");
      ROWS.forEach(([id, t, m, p0, p1, , sig]) => {
        const el = document.createElement("div");
        el.className = "f5-row";
        el.id = "f5-r-" + id;
        el.innerHTML =
          '<span class="f5-sel" id="f5-sel-' + id + '"></span>' +
          '<div class="f5-pill"><span class="f5-q' + p0 + '" id="f5-a-' + id + '">P' + p0 + '</span><span class="f5-q' + p1 + '" id="f5-b-' + id + '">P' + p1 + "</span></div>" +
          '<div class="f5-txt"><div class="f5-t">' + t + '</div><div class="f5-m">' + m + "</div></div>" +
          '<div class="f5-f">' + sig.map((_, k) => '<span><b id="f5-g-' + id + k + '" style="background:' + COLORS[k] + '"></b></span>').join("") + "</div>";
        list.insertBefore(el, scan);
      });
      // Reason card for the row that rises to the top.
      const reason = document.createElement("div");
      reason.id = "f5-reason";
      reason.innerHTML =
        '<svg viewBox="0 0 24 24"><path d="M3 18 C 8 18, 8 6, 13 6 S 18 12, 21 12" fill="none" stroke="#0088ff" stroke-width="2.4" stroke-linecap="round"/><circle cx="21" cy="12" r="2.4" fill="#cfe8ff"/></svg>' +
        "<span>Advances <strong>Earn a place in a research lab</strong> → <strong>Become a credible ML researcher</strong> · closes in 3 days</span><small>WHY P1</small>";
      document.getElementById("f5-r-apply").appendChild(reason);

      const tl = gsap.timeline({ paused: true });

      // Scene 1 — headline, panel rises. Rows in their stale order.
      const head = document.getElementById("f5-head");
      const hx = (1920 - head.offsetWidth) / 2, hy = (1080 - head.offsetHeight) / 2 - 40;
      tl.fromTo("#f5-head", { x: hx, y: hy + 40, opacity: 0 }, { y: hy, opacity: 1, duration: 0.45, ease: "expo.out" }, 0);
      tl.fromTo("#f5-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 0.08);
      tl.to("#f5-head", { x: 120, y: 70, scale: 0.3, duration: 0.7, ease: "expo.inOut" }, 0.9);
      tl.fromTo("#f5-panel", { y: 440, rotationX: 24, opacity: 0 }, { y: 0, rotationX: 0, opacity: 1, duration: 1.3, ease: "expo.out" }, 0.3);
      ROWS.forEach(([id], i) => {
        tl.fromTo("#f5-r-" + id, { y: i * STEP + 24, opacity: 0 }, { y: i * STEP, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.55 + i * 0.05);
        tl.set("#f5-b-" + id, { rotationX: -90 }, 0);
        tl.set("#f5-sel-" + id, { opacity: 0 }, 0);
        for (let k = 0; k < 5; k += 1) tl.set("#f5-g-" + id + k, { scaleY: 0.12 }, 0);
      });
      tl.set(["#f5-st2", "#f5-st3"], { opacity: 0 }, 0);
      tl.set("#f5-scan", { y: -150, opacity: 0 }, 0);
      tl.set("#f5-reason", { opacity: 0, scaleY: 0.4 }, 0);
      tl.set("#f5-ring", { opacity: 0, "--f5-a": "0deg" }, 0);

      // Scene 2 — cursor hits Reprioritize on the beat (2.048).
      const btn = document.getElementById("f5-btn");
      const bx = btn.offsetLeft + 32 + btn.offsetWidth * 0.45, by = 28 + btn.offsetTop + btn.offsetHeight * 0.55;
      tl.set("#f5-cursor", { x: 980, y: 700, opacity: 0, scale: 1 }, 0);
      tl.to("#f5-cursor", { opacity: 1, duration: 0.15 }, 1.2);
      tl.to("#f5-cursor", { x: bx - 6, y: by - 3, duration: 0.75, ease: "power3.inOut" }, 1.25);
      tl.to("#f5-cursor", { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1 }, 2.03);
      tl.to("#f5-btn", { scale: 0.95, duration: 0.08, yoyo: true, repeat: 1 }, 2.03);
      tl.fromTo("#f5-ripple", { x: bx, y: by, scale: 0.2, opacity: 0 }, { scale: 0.2, opacity: 1, duration: 0.01 }, 2.048);
      tl.to("#f5-ripple", { scale: 1.8, opacity: 0, duration: 0.5, ease: "power2.out" }, 2.06);
      tl.to("#f5-cursor", { x: bx + 70, y: by + 60, opacity: 0, duration: 0.5, ease: "power2.in" }, 2.4);
      tl.to("#f5-st1", { opacity: 0, y: -8, duration: 0.2 }, 2.06);
      tl.fromTo("#f5-st2", { y: 8 }, { opacity: 1, y: 0, duration: 0.25 }, 2.1);

      // Scene 3 — the panel border comes alive; a scan beam reads every task's five signals.
      tl.to("#f5-ring", { opacity: 1, duration: 0.3 }, 2.1);
      tl.to("#f5-ring", { "--f5-a": "540deg", duration: 2.4, ease: "none" }, 2.1);
      tl.to("#f5-ring", { opacity: 0, duration: 0.4 }, 4.2);
      tl.to("#f5-scan", { opacity: 1, duration: 0.15 }, 2.5);
      tl.to("#f5-scan", { y: ROWS.length * STEP - 40, duration: 1.4, ease: "power1.inOut" }, 2.5);
      tl.to("#f5-scan", { opacity: 0, duration: 0.25 }, 3.85);
      ROWS.forEach(([id, , , , , , sig], i) => {
        const at = 2.62 + i * 0.22;
        sig.forEach((v, k) => tl.to("#f5-g-" + id + k, { scaleY: Math.max(0.08, v), duration: 0.45, ease: "expo.out" }, at + k * 0.03));
      });

      // Scene 4 — FLIP re-sort on beat 4.096; pills flip to their new priority.
      ROWS.forEach(([id, , , p0, p1, to], i) => {
        const moved = to !== i;
        tl.set("#f5-r-" + id, { zIndex: to < i ? 3 : 1 }, 4.05);
        tl.to("#f5-r-" + id, { y: to * STEP, duration: 0.8, ease: "expo.inOut" }, 4.096 + (moved ? 0 : 0.05));
        if (p0 !== p1) {
          tl.to("#f5-a-" + id, { rotationX: 90, duration: 0.2, ease: "power2.in" }, 4.35 + to * 0.05);
          tl.to("#f5-b-" + id, { rotationX: 0, duration: 0.25, ease: "back.out(2)" }, 4.55 + to * 0.05);
        }
      });
      tl.to("#f5-st2", { opacity: 0, y: -8, duration: 0.2 }, 4.5);
      tl.fromTo("#f5-st3", { y: 8 }, { opacity: 1, y: 0, duration: 0.25 }, 4.6);

      // Scene 5 — camera punches into the new top task; its reason expands (others make room).
      tl.to("#f5-sel-apply", { opacity: 1, duration: 0.3 }, 5.0);
      ROWS.forEach(([id, , , , , to]) => {
        if (to > 0) tl.to("#f5-r-" + id, { y: to * STEP + 84, duration: 0.6, ease: "expo.inOut" }, 5.12);
      });
      tl.to("#f5-reason", { opacity: 1, scaleY: 1, duration: 0.55, ease: "expo.out" }, 5.2);
      const fx = 350 + 32 + 578, fy = 188 + 160 + 80;
      tl.set("#f5-cam", { transformOrigin: "50% 50%" }, 0);
      tl.fromTo("#f5-cam", { scale: 1, x: 0, y: 0 }, { scale: 1.03, duration: 5.1, ease: "none" }, 0);
      tl.to("#f5-cam", { scale: 1.5, x: 1.5 * (960 - fx), y: 1.5 * (540 - fy), duration: 1.3, ease: "expo.inOut" }, 5.12);
      tl.to("#f5-cam", { scale: 1.56, duration: 1.75, ease: "none" }, 6.42);

      window.__timelines["05-priority"] = tl;
      if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
    });
  </script>
