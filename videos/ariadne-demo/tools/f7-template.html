  <script>
    document.fonts.load('900 92px "Inter"').then(function () {
      const CARDS = /*CARDS*/; // rest pose, whether the thread passes over it, and where along the weave
      const W = /*WDATA*/; // weave path { len, pts } in screen px
      const B = /*BDATA*/; // mark centreline { len (mark units), pts (screen px) }
      const T_IN = 0.2, TW = 1.25, TB = 0.6; // weave 0.2→1.45 · write the mark 1.45→2.05 (bar line)

      const tl = gsap.timeline({ paused: true });

      // Clip for the "over" copy: the rest pose of each card the thread passes over.
      const NS = "http://www.w3.org/2000/svg";
      const clip = document.getElementById("f7-clip");
      CARDS.forEach((c, i) => {
        if (!c.over) return;
        const el = document.getElementById("f7-c" + i);
        const w = el.offsetWidth, h = el.offsetHeight;
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", c.x);
        r.setAttribute("y", c.y);
        r.setAttribute("width", w);
        r.setAttribute("height", h);
        r.setAttribute("rx", 14);
        r.setAttribute("transform", "rotate(" + c.r + " " + (c.x + w / 2) + " " + (c.y + h / 2) + ")");
        clip.appendChild(r);
      });

      // Scene 1 — pull back across the floating pieces; the thread weaves over and under them.
      tl.set("#f7-cam", { transformOrigin: "50% 50%" }, 0);
      tl.fromTo("#f7-cam", { scale: 1.26 }, { scale: 1.0, duration: 1.4, ease: "power3.out" }, 0);
      CARDS.forEach((c, i) => {
        tl.fromTo("#f7-c" + i, { x: c.x + 30, y: c.y + 40, rotation: c.r * 1.6, opacity: 0 },
          { x: c.x, y: c.y, rotation: c.r, opacity: 1, duration: 0.55, ease: "expo.out" }, i * 0.04);
        tl.set("#f7-l" + i, { opacity: 0 }, 0);
      });
      const COMET = 150, BC = 26;
      tl.set(".f7-w", { attr: { "stroke-dasharray": W.len + " " + W.len }, strokeDashoffset: W.len }, 0);
      tl.set(".f7-wc", { attr: { "stroke-dasharray": COMET + " " + W.len * 2 }, strokeDashoffset: COMET, opacity: 0 }, 0);
      tl.set(["#f7-mark-line", "#f7-mark-glow", "#f7-mask-line"], { attr: { "stroke-dasharray": B.len + " " + B.len }, strokeDashoffset: B.len }, 0);
      tl.set("#f7-mark-comet", { attr: { "stroke-dasharray": BC + " " + B.len * 2 }, strokeDashoffset: BC, opacity: 0 }, 0);
      tl.set(".f7-head", { x: W.pts[0][0], y: W.pts[0][1] }, 0);
      tl.set("#f7-head-top", { opacity: 0 }, 0);

      const draw = gsap.timeline();
      draw.to(".f7-w", { strokeDashoffset: 0, duration: TW, ease: "power1.in" }, 0);
      draw.to(".f7-wc", { strokeDashoffset: COMET - W.len, duration: TW, ease: "power1.in" }, 0);
      draw.to(".f7-head", { keyframes: W.pts.slice(1).map(([x, y]) => ({ x, y, ease: "none" })), ease: "power1.in", duration: TW }, 0);
      draw.to(["#f7-mark-line", "#f7-mark-glow", "#f7-mask-line"], { strokeDashoffset: 0, duration: TB, ease: "power2.out" }, TW);
      draw.to("#f7-mark-comet", { strokeDashoffset: BC - B.len, duration: TB, ease: "power2.out" }, TW);
      draw.to(".f7-head", { keyframes: B.pts.slice(1).map(([x, y]) => ({ x, y, ease: "none" })), ease: "power2.out", duration: TB }, TW);
      // The tail pulls through after the head: the whole thread becomes the mark.
      draw.to(".f7-w", { strokeDashoffset: -W.len, duration: 0.7, ease: "power2.in" }, TW);
      tl.add(draw, T_IN);
      tl.to(".f7-wc", { opacity: 1, duration: 0.1 }, T_IN);
      tl.to(".f7-wc", { opacity: 0, duration: 0.1 }, T_IN + TW - 0.05);
      tl.to("#f7-mark-comet", { opacity: 1, duration: 0.05 }, T_IN + TW);
      tl.to("#f7-head-top", { opacity: 1, duration: 0.01 }, T_IN + TW);
      tl.to([".f7-head", "#f7-mark-comet"], { opacity: 0, duration: 0.25 }, T_IN + TW + TB);
      tl.to(["#f7-mark-line", "#f7-mark-glow"], { opacity: 0, duration: 0.5, ease: "power2.out" }, T_IN + TW + TB + 0.05);

      // Cards light as the head crosses them (power1.in reaches progress p at √p of the time).
      CARDS.forEach((c, i) => {
        const at = T_IN + TW * Math.sqrt(c.frac);
        tl.to("#f7-l" + i, { opacity: 1, duration: 0.18, ease: "power2.out" }, at - 0.04);
        tl.to("#f7-c" + i, { scale: 1.05, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, at - 0.04);
      });

      // Scene 2 — the pieces fall away into black as the thread lets go of them.
      CARDS.forEach((c, i) => {
        tl.to("#f7-c" + i, { y: c.y + 120, opacity: 0, filter: "blur(10px)", duration: 0.55, ease: "power3.in" }, 1.5 + i * 0.05);
      });

      // Scene 3 — the mark lands on the bar line (2.048); lockup, hero line, family endorsement.
      tl.fromTo("#f7-flare", { scale: 0.1, opacity: 0 }, { scale: 1.2, opacity: 1, duration: 0.35, ease: "power3.out" }, 2.02);
      tl.to("#f7-flare", { scale: 0.95, opacity: 0.55, duration: 1.2, ease: "power2.out" }, 2.37);
      tl.fromTo("#f7-markpop", { scale: 1, svgOrigin: "/*MC*/" }, { scale: 1.08, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, 2.048);
      const word = document.getElementById("f7-word");
      const letters = word.textContent.split("");
      word.textContent = "";
      letters.forEach((ch) => { const sp = document.createElement("span"); sp.className = "f7-ch"; sp.textContent = ch; word.appendChild(sp); });
      gsap.utils.toArray(".f7-ch").forEach((sp, i) => {
        tl.fromTo(sp, { x: (i - (letters.length - 1) / 2) * 30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 2.56);
      });
      tl.fromTo("#f7-hero", { opacity: 0, y: 26, scale: 1.08, filter: "blur(14px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 3.072);
      tl.fromTo("#f7-fab", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.584);
      tl.to(["#f7-lock", "#f7-fab"], { scale: 1.025, duration: 2.4, ease: "none" }, 3.2);
      tl.to("#f7-cam", { scale: 1.025, duration: 2.4, ease: "none" }, 3.2);
      // Final frame: settle to black.
      tl.fromTo("#f7-black", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.in" }, 5.55);

      window.__timelines["07-close"] = tl;
      if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
    });
  </script>
