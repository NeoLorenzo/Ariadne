name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Check repository privacy
        run: npm run check:privacy

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUBSTACK_ARCHIVE_SYNC_URL: ${{ secrets.NEXT_PUBLIC_SUBSTACK_ARCHIVE_SYNC_URL }}
        run: npm run build

      - name: Check exported site privacy
        run: npm run check:privacy

      - name: Smoke test production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/manifest.webmanifest
          test -f out/tasks/index.html
          grep -q "Ariadne" out/index.html
          if grep -R -n -E --include='*.html' --include='*.js' --include='*.css' --include='*.json' --include='*.webmanifest' '(/Ariadne/|neolorenzo\.github\.io/Ariadne)' out; then
            echo "Legacy Ariadne GitHub Pages path found in production artifact."
            exit 1
          fi

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test live Ariadne
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3             https://ariadne.fabbrosystems.com/ --output /tmp/ariadne.html
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3             https://ariadne.fabbrosystems.com/manifest.webmanifest --output /tmp/ariadne-manifest.webmanifest
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3             https://ariadne.fabbrosystems.com/tasks/ --output /tmp/ariadne-tasks.html
          grep -q "Ariadne" /tmp/ariadne.html
          if grep -E -q '(/Ariadne/|neolorenzo\.github\.io/Ariadne)' /tmp/ariadne.html /tmp/ariadne-tasks.html; then
            echo "Legacy Ariadne deployment path found on the live domain."
            exit 1
          fi
