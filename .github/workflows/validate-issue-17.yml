name: Validate issue 17

on:
  push:
    branches: ["fix/17-directional-task-priority"]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/17-directional-task-priority
          fetch-depth: 0

      - name: Apply review corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/tasks/page.js")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '    priority: directionalGoalId ? 1 : normalizePriority(task.priority, task.materialConsequence),',
                  '    priority: directionalGoalId ? 0 : normalizePriority(task.priority, task.materialConsequence),'
              ),
              (
                  '''function calculatePriorityScore(taskLike) {\n  if (getDirectionalGoalId(taskLike)) {\n    return 1;\n  }\n  return normalizePriority(taskLike?.priority, taskLike?.materialConsequence);\n}\n''',
                  '''function calculatePriorityScore(taskLike) {\n  return normalizePriority(taskLike?.priority, taskLike?.materialConsequence);\n}\n'''
              )
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Check repository privacy
        run: npm run check:privacy

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: "/Ariadne"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUBSTACK_ARCHIVE_SYNC_URL: ${{ secrets.NEXT_PUBLIC_SUBSTACK_ARCHIVE_SYNC_URL }}
        run: npm run build

      - name: Remove validation helper
        run: rm .github/workflows/validate-issue-17.yml

      - name: Commit reviewed implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep directional presentation separate from P1"
          git push origin HEAD:fix/17-directional-task-priority
