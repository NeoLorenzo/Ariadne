name: Feature lockfile sync

on:
  push:
    branches:
      - "feature/opportunity-landscape-chart"

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/opportunity-landscape-chart

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/feature-lockfile.yml
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync lockfile for Recharts"
          git push
