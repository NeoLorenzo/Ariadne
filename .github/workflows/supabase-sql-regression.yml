name: Supabase SQL regression tests

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/supabase-sql-regression.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/supabase-sql-regression.yml'

jobs:
  sql-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Reset database to migrations
        run: supabase db reset
      - name: Run SQL regression tests
        run: |
          for test_file in supabase/tests/*.sql; do
            echo "Running $test_file"
            supabase db execute --local --file "$test_file"
          done
